[project]
name = "sub-tools"
version = "0.9.0"
description = "A robust Python toolkit powered by Google's Gemini API for converting video content into accurate, multilingual subtitles."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "audioop-lts>=0.2.1; python_version >= '3.13'",
    "google-api-core>=2.28.1",
    "google-genai>=1.52.0",
    "openai>=1.68.0",
    "pycountry>=24.6.1",
    "pytest>=9.0.1",
    "pytest-asyncio>=0.23.5",
    "rich>=13.9.4",
    "subtitle-edit-rate==0.4.0",
]

[project.scripts]
sub-tools = "sub_tools:main"
sub-tools-eval = "sub_tools.evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
